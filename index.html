<!DOCTYPE html>
<html>
  <head>
    <script>
      (async function() {
        async function get_index() {
          const req = await fetch("index.json");
          return req.json();
        }
        const index = await get_index();
        const query = "network first programming language";
        const words = query.split(/\s+/);
        const requests = words.map(word => {
          // TODO(max): failure
          const [start, length] = index[word];
          const end = start+length-1;
          return fetch("vecs.jsonl", {
            headers: new Headers({
              "Range": `bytes=${start}-${end}`,
            }),
          });
        });
        const responses = await Promise.all(requests);
        const embeddings = await Promise.all(responses.map(r => r.json()));
        console.log(embeddings);
      })();
    </script>
  </head>
  <body>
    hi
  </body>
</html>
